name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run core tests
        run: python -m unittest discover -s tests -v
      - name: Compile application
        run: python -m py_compile tokenluma_core.py tokenluma_app.py